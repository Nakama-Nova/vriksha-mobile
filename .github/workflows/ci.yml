name: Mobile CI

# Every push and PR: analyze, test, and build an installable Android APK
# (Actions run -> Artifacts). The APK is signed with the debug key: fine for
# installing on the shop's own phones, not for the Play Store.
on:
  push:
    branches: [ main, 'feature/*' ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.8"
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      - name: Build APK
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: vriksha-capture-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
