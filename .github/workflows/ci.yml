name: Mobile CI

# Every push and PR: analyze, test, and build an installable Android APK
# (Actions run -> Artifacts). The APK is signed with the debug key: fine for
# installing on the shop's own phones, not for the Play Store.
on:
  push:
    branches: [ main, 'feature/*' ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.8"
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      # A stable key lets a new build update the one already on the phone. It lives in
      # repository secrets (ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD,
      # ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD); see README, Signing. Without them the
      # APK is debug-signed and cannot be installed over an earlier build.
      - name: Prepare the release key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "Signing with the release key."
          else
            echo "::warning::No release key set: this APK is debug-signed and cannot update an installed copy."
          fi

      - name: Build APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: vriksha-capture-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
